- name: morpho_midnight_list_markets
  description: 'Cursor-paginated list of Midnight markets.


    **Use this to discover markets.** For a given user''s positions on those markets, follow up with `morpho_midnight_list_user_positions`.


    **Filters.** Address filters (`loan_assets`, `collateral_assets`, `oracle_addresses`, `enter_gates`,
    `liquidator_gates`) must be combined with `chain_ids` — an address alone is not chain-unique. Lowercase
    addresses are checksummed server-side. Pass `active_only=true` to exclude markets past maturity.


    **Pagination.** Response follows the list envelope: `{ cursor, data }`. Pass back `cursor` verbatim
    on the next call. A `null` `cursor` means the last page.


    **Cache.** `public, max-age=5, stale-while-revalidate=2`.'
- name: morpho_midnight_get_market
  description: 'Detail lookup for a single market. `:market-id` is the stable Midnight market id and is
    unique across supported chains, so no chain id is required.


    Returns the immutable market configuration inside a `data` envelope. Use `morpho_midnight_get_market_state`
    for dynamic market state. 404s when the id is unknown.'
- name: morpho_midnight_get_market_state
  description: 'Dynamic state lookup for a single market. `:market-id` is the stable Midnight market id
    and is unique across supported chains, so no chain id is required.


    Returns the market state inside a `data` envelope. Use `morpho_midnight_get_market` for immutable
    market configuration. 404s when the id is unknown.'
- name: morpho_midnight_list_user_positions
  description: 'Cursor-paginated list of a user''s current Midnight positions.


    **Position type.** `type` is `lend` for positions with credit, `borrow` for positions with debt, or
    `collateral_only` for positions with no credit or debt but remaining collateral. Closed positions
    with no credit, no debt, and no remaining collateral are excluded.


    **Performance fields.** `cost_basis` uses the average cost method and is returned as a WAD-scaled
    bigint string in loan-token units. `effective_rate_wad` is the unchanged WAD-scaled compounded IRR+
    using a 365.25-day year; `effective_apr` is the simple annualized decimal fraction using a 365-day
    year, capped at `10`, and derived from persisted open lots. Analytics can be `null` when there is
    not enough attributable history.


    **Filters.** `chain_ids` is required when `loan_assets` is provided. `collateral_assets` matches configured
    market collateral tokens across all chains unless `chain_ids` narrows the query; lowercase addresses
    are checksummed. Range filters exist on `created_at`, `credit`, `debt`, `cost_basis`, and `effective_rate_wad`.
    `effective_apr` has no filter or sort key. `active_only=true` excludes matured markets. `listed=true`
    keeps only positions on listed markets; `listed=false` keeps only positions on unlisted markets.


    **Pagination.** Response envelope: `{ cursor, data }`. Positions are ordered newest-first by `created_at`
    by default.


    **Cache.** `public, max-age=2, stale-while-revalidate=1`.'
- name: morpho_midnight_list_market_positions
  description: 'Cursor-paginated list of current Midnight positions for a market.


    `:market-id` is the stable Midnight market id and is globally unique across supported chains.


    The response uses the same public position item shape as `morpho_midnight_list_user_positions`: `{
    cursor, data }`, with `type`, state fields, collateral balances, and performance analytics.


    **Filters.** Range filters exist on `created_at`, `credit`, `debt`, `cost_basis`, and `effective_rate_wad`.
    `effective_apr` has no filter or sort key. `active_only=true` excludes matured markets. The path market
    id is always enforced.


    **Pagination.** Pass back `cursor` verbatim on the next call. Positions are ordered newest-first by
    `created_at` by default.


    **Cache.** `public, max-age=2, stale-while-revalidate=1`.'
- name: morpho_midnight_get_user_position
  description: 'Detail lookup for a single position by `(market-id, user-address)`.


    `:market-id` is the stable Midnight market id and is globally unique across supported chains. `:user-address`
    accepts any casing and is checksummed server-side.


    Returns the position inside a `data` envelope. When the position is **closed** (no credit, no debt,
    no remaining collateral) or has never existed for a known market, the endpoint returns zero balances
    with `type: null`. Positions with `credit == 0 && debt == 0` but non-empty `collaterals` are returned
    as `type: "collateral_only"`.'
- name: morpho_midnight_get_user_position_performance
  description: 'Performance-only lookup for a single position by `(market-id, user-address)`.


    Returns performance analytics inside a `data` envelope. `effective_rate_wad` is compounded IRR+ using
    a 365.25-day year; `effective_apr` is simple interest using a 365-day year and is capped at `10` (1000%).
    The position detail endpoint omits these fields to keep state and performance concerns separate. When
    the position is closed or has never existed for a known market, this endpoint returns `type: null`
    and null analytics.'
- name: morpho_midnight_get_offer_group
  description: 'Returns every offer group matching the onchain group id, regardless of lifecycle status.
    The maker is not required; optional chain_id and maker query parameters can disambiguate the lookup.
    Distinct chain, maker, and group-id combinations remain separate, and no match returns an empty data
    array.


    The endpoint returns every latest offer revision in each matched group and exposes the current lifecycle
    as `status`. Each group exposes the shared offer intent as `type`, or `null` when its latest offers
    have inconsistent `buy` and `reduce_only` values. It does not apply Router mempool admission policy:
    oracle, token, market-triplet, LLTV, RCF threshold, and other mempool-validation policy checks do
    not gate retrieval.


    Each nested offer includes the exact per-offer `ratifier_data` bytes originally submitted, plus `parsed_ratifier_data`,
    a structured view discriminated by `ratifier_type`. The type is identified by matching `ratifier`
    against the chain''s known Midnight ratifier deployments: `rate_v1` exposes `rate_per_second_wad`
    and `allowed_taker`, `price_v1` exposes `allowed_taker` (the offer-level `tick` is the ratified price),
    and `ecrecover` and `setter` expose only their type. A zero `allowed_taker` means any taker may take
    the offer. An unrecognized ratifier address returns `unknown`; a recognized address whose `ratifier_data`
    cannot be decoded returns `invalid` with `expected_ratifier_type`.'
- name: morpho_midnight_list_user_offer_groups
  description: 'Cursor-paginated list of a user''s offer groups with nested offers. The `statuses` filter
    accepts one or more lifecycle states with OR semantics. The deprecated singular `status` parameter
    is a single-value alias; requests containing both are rejected. Omitting both defaults to `active`
    for backward compatibility.


    **Maturity policy.** The list includes only offers whose maturity is at 15:00 UTC, the maturities
    Router quotes. Other offers are excluded before lifecycle, filters, type, callback, and group `expiry`
    are computed, and groups with no such offer are omitted. The by-group endpoint returns every offer
    regardless of maturity.


    Lifecycle is derived from every latest 15:00 UTC offer revision before market, asset, maturity, type,
    callback, or listing filters are applied. `cancelled` has highest priority and requires an explicit
    `SetConsumed(type(uint128).max)` event; a `Take` reaching the same numeric value remains `filled`.
    Otherwise, a group is `filled` when every latest leg has no remaining capacity. It is `active` when
    at least one remaining leg has started and is at or before both its expiry and non-zero maturity.
    It is `scheduled` when no leg is active but at least one remaining leg starts in the future without
    having expired or matured. All remaining groups are `expired`. Active takes remain valid at exact
    expiry or maturity, matching the onchain inclusive boundary.


    Nested offers are lifecycle-targeted for list results: active returns live remaining-capacity legs,
    scheduled returns future remaining-capacity legs, filled and cancelled return all latest legs, and
    expired returns terminal expired or matured legs. Active and scheduled group `expiry` is the maximum
    not-yet-ended latest-offer horizon; terminal statuses use the complete latest set. Requesting all
    five statuses returns every group with a 15:00 UTC offer exactly once.


    **Callbacks.** A group has `callback.type=blue_buy` only when every latest offer considered for the
    lifecycle has the same callback address and data, contains canonical Blue market parameters with the
    matching loan token, and the earliest indexed registration from the official factory names the maker
    as owner at or before the offer''s creation block. Registration transaction or log order within the
    same block is intentionally ignored. The callback is `null` when any condition fails. Verified callbacks
    include their address, decoded Blue market parameters, and derived Blue market id.


    **Types.** Group `type` is derived from the shared `buy` and `reduce_only` values across all offers
    considered for the requested lifecycle. `buy` and `sell` mean `reduce_only=false`; `buy_reduce_only`
    and `sell_reduce_only` mean `reduce_only=true`. For the portfolio, `buy` and `sell_reduce_only` represent
    lend orders and secondary exits, while `sell` and `buy_reduce_only` represent borrow orders and secondary
    exits. Inconsistent groups return `type: null` and do not match the `types` filter. This describes
    offer intent, not the maker''s current position.


    **Filters.** `market_ids` filters the group page to groups containing at least one offer in the requested
    lifecycle and any requested market, but does not narrow nested sibling offers. `chain_ids` and `groups`
    filter the group page and nested offers. `loan_assets`, `collateral_assets`, exact `maturities`, and
    the inclusive unix-second bounds `maturity_gte` and `maturity_lte` filter both the group page and
    returned offers in the requested lifecycle for every status, and combine with other filters using
    AND semantics. `types` accepts comma-separated offer-group types with OR semantics and combines with
    other filters using AND semantics without narrowing nested offers. `callback_type=blue_buy` keeps
    only groups with verified Blue callback metadata. `listed=true` requires every lifecycle-matching
    offer in a group to be on a listed market; `listed=false` requires at least one lifecycle-matching
    unlisted offer. Address filters match across all chains unless `chain_ids` also narrows the query;
    lowercase addresses are checksummed. Group `expiry` is not narrowed by offer filters; active results
    use the active-eligible latest offer set, while expired results use the complete latest offer set.
    `created_at_gte` and `created_at_lte` filter by the first matching offer created in each group. `market_ids`,
    `loan_assets`, `collateral_assets`, `maturities`, `groups`, and `types` are capped at 20 values. Each
    offer includes both `market_id` and the immutable `market` config used to derive it, because uncreated
    markets cannot be decoded from `market_id` alone.


    **Ratifier data.** Each nested offer includes the exact per-offer `ratifier_data` bytes originally
    submitted, plus `parsed_ratifier_data`, a structured view discriminated by `ratifier_type`. The type
    is identified by matching `ratifier` against the chain''s known Midnight ratifier deployments: `rate_v1`
    exposes `rate_per_second_wad` and `allowed_taker`, `price_v1` exposes `allowed_taker` (the offer-level
    `tick` is the ratified price), and `ecrecover` and `setter` expose only their type. A zero `allowed_taker`
    means any taker may take the offer. An unrecognized ratifier address returns `unknown`; a recognized
    address whose `ratifier_data` cannot be decoded returns `invalid` with `expected_ratifier_type`.


    **Pagination.** Response follows the list envelope: `{ cursor, data }`. Pagination is over groups;
    nested offers are not split across pages. Sort groups with `sort_by=id|created_at` and `sort_direction=asc|desc`.'
- name: morpho_midnight_list_books
  description: Returns books for active maturities admitted by the current policy, with market metadata
    and the top 3 ask/bid levels. Unlisted and past maturities are excluded, even when requested with
    `ids`. If a maturity leaves the policy, its books are hidden immediately, including books with existing
    offers. Supports filtering, sorting, and pagination; default sort is `id` ascending.
- name: morpho_midnight_get_book
  description: Returns one active book whose maturity is admitted by the current policy, with market metadata
    and both sides. If its maturity leaves the policy, the book becomes unavailable immediately, including
    when existing offers remain. A visible book with no offers returns empty `asks` and `bids`. Each side
    returns up to `depth` levels, sorted best price first.
- name: morpho_midnight_get_book_side
  description: Returns one side of a book as price levels grouped by tick with total units, assets, and
    price, sorted best price first.
- name: morpho_midnight_get_book_side_takeable_offers
  description: Returns up to 1,000 executable offers for one book side, sorted best price first. This
    endpoint is not paginated and does not accept a limit or cursor.
- name: morpho_midnight_get_book_quote
  description: 'Returns a bundle-ready quote for the requested assets or units, plus expected best/worst
    average prices and maximum executable liquidity.


    The endpoint optimizes for successful target-aware bundle execution under contention: `takeable_offers`
    are best-priced per-offer caps and their total can exceed the requested target, giving a bundle executor
    fallback liquidity when earlier offers are partially consumed or skipped.


    At most `limit` (default and maximum 10,000) best-priced takeable offers are walked and returned;
    prices and availability always describe exactly the returned window. A request that cannot fill within
    `limit` offers returns 422.


    Use the returned takeable offers with a bundle abstraction that stops at your requested target and
    applies your max/min asset or unit protections. If you execute takeable offers independently with
    Midnight.take, do not submit every returned unit blindly: clamp each offer to your remaining target
    and current takeability, or you may execute more than intended.


    If the requested size cannot be fully satisfied at quote time under the selected guard, the endpoint
    returns 422.'
- name: morpho_midnight_list_maker_takeable_offers
  description: Returns one maker's active offers. A fresh offer is withheld until measured, unless indexed
    ratifier state proves both a blocker and maker intent through the tree signature, signer-authorization
    history, or root history. Eligible blocked offers return with `units` set to `0`; missing state and
    unproven offers naming the maker remain hidden.
- name: morpho_prepare_borrow
  description: 'Prepare a borrow of the loan token from a Morpho market against collateral already supplied.
    Amounts are integer strings in base units. If data.status is signature_required, sign each data.signatures[].typed_data
    and call this tool again with the same selector and body { continuation, signatures: [{ id, signature
    }] }. A finalized result lists data.calls; send them unchanged and in order from the account only
    if data.simulation.status is success and before data.expires_at. If data.simulation.status is failed,
    show data.simulation.failure and do not send the calls. action_proof is the unverified Morpho-Action-Proof
    response header. Nothing is signed or sent onchain.'
- name: morpho_prepare_refinance
  description: 'Prepare moving a borrow position (collateral and debt) from one Morpho market to another
    market on the same chain. Amounts are integer strings in base units. If data.status is signature_required,
    sign each data.signatures[].typed_data and call this tool again with the same selector and body {
    continuation, signatures: [{ id, signature }] }. A finalized result lists data.calls; send them unchanged
    and in order from the account only if data.simulation.status is success and before data.expires_at.
    If data.simulation.status is failed, show data.simulation.failure and do not send the calls. action_proof
    is the unverified Morpho-Action-Proof response header. Nothing is signed or sent onchain.'
- name: morpho_prepare_supply_collateral_and_borrow
  description: 'Prepare supplying collateral to a Morpho market and borrowing against it in one step.
    Amounts are integer strings in base units. If data.status is signature_required, sign each data.signatures[].typed_data
    and call this tool again with the same selector and body { continuation, signatures: [{ id, signature
    }] }. A finalized result lists data.calls; send them unchanged and in order from the account only
