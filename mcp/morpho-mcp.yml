- name: morpho_prepare_repay_and_withdraw_collateral
  description: 'Prepare repaying a Morpho market borrow and withdrawing collateral in one step. Amounts
    are integer strings in base units. If data.status is signature_required, sign each data.signatures[].typed_data
    and call this tool again with the same selector and body { continuation, signatures: [{ id, signature
